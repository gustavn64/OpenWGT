name: build

# The port for Linux (x86-64, aarch64: an AppImage, a .deb, an .rpm and
# the bare program in a .tar.gz), Windows (x86-64, arm64: an .exe each),
# macOS (universal: the app in a .dmg) and the browser (the site in a .zip,
# and a container image serving it), on pushes to master, tags and pull
# requests. None carries the CD's data: they run on the port's own packs
# (OpenWGFX, OpenWSFX, OpenWDATA), or on the CD image the player gives at
# run time, natively on the command line or in Change CD... (`pick`), in
# the browser on the page. A tag v* publishes every package on the tag's
# release and the container image on ghcr.io (packaging/README.md).

on:
  push:
    branches: ['master']
    tags: ['v*']
    # A push that changes only words for people (the docs, the READMEs,
    # the packaging notes) builds nothing; a tag always builds.
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request stops the run it makes
# needless; a tag's run is never stopped.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu LTS still in standard support, on purpose: the
        # AppImage uses the host's glibc, which has to be at least as new
        # as the one it was built against (the AppImage catalog tests on
        # that release). Not the newest runner, then; move on only when
        # this one leaves standard support. The arch as AppImage spells it.
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # (keyed by the runner image too: a target/ built on another Ubuntu
      # release doesn't load)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config file

      - name: Build
        run: cargo build --release --locked -p openwgt

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Package (AppImage)
        timeout-minutes: 10
        run: |
          out=openwgt-${{ matrix.arch }}.AppImage
          curl -sSLfo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy
          doc=AppDir/usr/share/doc/openwgt
          mkdir -p $doc
          cp LICENSE README.md $doc/
          mkdir -p $doc/fonts && cp crates/engine/fonts/README.md crates/engine/fonts/LICENSE-*.txt $doc/fonts/
          cp crates/widget/res/icon.png openwgt.png
          # the window, the GPU and the sound are the host's (dlopen'd, or
          # linuxdeploy's excludelist: libasound, libGL, libvulkan)
          LDAI_OUTPUT=$out ./linuxdeploy --appdir AppDir -e target/release/openwgt \
              -d crates/widget/res/openwgt.desktop -i openwgt.png --output appimage
          # (it starts: the libraries are all there)
          { ./$out --help 2>&1 || true; } | grep "usage:"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The same program as the AppImage's, packaged for the distributions'
      # own package managers (crates/widget/Cargo.toml's package.metadata),
      # and bare, for anyone who'd rather unpack it.
      - name: Package (.deb, .rpm, .tar.gz)
        run: |
          a=${{ matrix.arch }}
          cargo deb -p openwgt --no-build --output openwgt-$a.deb
          cargo generate-rpm -p crates/widget --output openwgt-$a.rpm
          t=openwgt-linux-$a
          mkdir $t
          cp target/release/openwgt LICENSE README.md $t/
          mkdir $t/fonts && cp crates/engine/fonts/README.md crates/engine/fonts/LICENSE-*.txt $t/fonts/
          tar czf $t.tar.gz $t

      - uses: actions/upload-artifact@v7
        with:
          name: openwgt-${{ matrix.arch }}.AppImage
          path: openwgt-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: openwgt-linux-${{ matrix.arch }}-packages
          path: |
            openwgt-${{ matrix.arch }}.deb
            openwgt-${{ matrix.arch }}.rpm
            openwgt-linux-${{ matrix.arch }}.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # the C runtime linked in: the .exe needs only Windows' own DLLs
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build (x86-64 and arm64)
        run: |
          cargo build --release --locked -p openwgt
          cargo build --release --locked -p openwgt --target aarch64-pc-windows-msvc

      - name: Package
        run: |
          cp target/release/openwgt.exe openwgt-windows-x86_64.exe
          cp target/aarch64-pc-windows-msvc/release/openwgt.exe openwgt-windows-arm64.exe
          # (it starts; the arm64 one can't on this runner)
          { ./openwgt-windows-x86_64.exe --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v7
        with:
          name: openwgt-windows
          path: |
            openwgt-windows-x86_64.exe
            openwgt-windows-arm64.exe

  macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (arm64 and x86-64)
        run: |
          cargo build --release --locked -p openwgt --target aarch64-apple-darwin
          cargo build --release --locked -p openwgt --target x86_64-apple-darwin

      - name: Package (app in a dmg)
        timeout-minutes: 10
        run: |
          app="dmg/OpenWGT.app"
          c="$app/Contents"
          mkdir -p "$c/MacOS" "$c/Resources"
          lipo -create -output "$c/MacOS/openwgt" \
              target/aarch64-apple-darwin/release/openwgt target/x86_64-apple-darwin/release/openwgt
          v=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac
          sed "s/@VERSION@/$v/" crates/widget/res/Info.plist > "$c/Info.plist"
          # the icon, from crates/widget/res/icon.png
          mkdir openwgt.iconset
          for n in 16 32 128 256 512; do
              sips -z $n $n crates/widget/res/icon.png --out openwgt.iconset/icon_${n}x${n}.png > /dev/null
              if [ $n -le 256 ]; then
                  sips -z $((n * 2)) $((n * 2)) crates/widget/res/icon.png --out openwgt.iconset/icon_${n}x${n}@2x.png > /dev/null
              fi
          done
          iconutil -c icns openwgt.iconset -o "$c/Resources/openwgt.icns"
          cp LICENSE README.md "$c/Resources/"
          mkdir -p "$c/Resources/fonts" && cp crates/engine/fonts/README.md crates/engine/fonts/LICENSE-*.txt "$c/Resources/fonts/"
          otool -L "$c/MacOS/openwgt"
          lipo -info "$c/MacOS/openwgt"
          codesign --force --deep -s - "$app"
          # (it starts)
          { "$c/MacOS/openwgt" --help 2>&1 || true; } | grep "usage:"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "OpenWGT" -srcfolder dmg -ov -format UDZO openwgt-macos.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: openwgt-macos
          path: openwgt-macos.dmg

  # The browser build (docs/web.md), without the CD's data: the page plays
  # without it or asks the player for their CD image. The site: the front
  # page (crates/widget/web/front.html) with the game in play/ under it,
  # as openwgt-web.zip on every release; it's hosted elsewhere.
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: The wasm-bindgen version the crates pin
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/widget/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: tools/build-web.sh --out web

      - name: Assemble the site
        run: |
          # The site must never carry game data, only the port's own files.
          if find web -type f ! -name '*.js' ! -name '*.wasm' ! -name '*.html' ! -name icon.png ! -name manifest.webmanifest | grep .; then
            echo "unexpected files in the build"; exit 1
          fi
          d=openwgt-web
          mkdir -p $d/play
          cp -r web/index.html web/widget.js web/widget_bg.wasm web/snippets web/icon.png web/manifest.webmanifest $d/play/
          cp crates/widget/web/front.html $d/index.html
          cp crates/widget/res/icon.png $d/
          cp LICENSE README.md $d/
          mkdir $d/fonts && cp crates/engine/fonts/README.md crates/engine/fonts/LICENSE-*.txt $d/fonts/
          zip -r $d.zip $d

      - uses: actions/upload-artifact@v7
        with:
          name: openwgt-web
          path: openwgt-web.zip

  # The site served by nginx, for anyone to host the browser version
  # (packaging/docker): built on every push, pushed to ghcr.io on a tag.
  docker:
    needs: web
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: openwgt-web

      - run: unzip -q openwgt-web.zip

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A release v1.2.3 is :1.2.3, :1.2 and :latest; the labels tie the
      # package to this repository (its page shows the description and the
      # README, and the workflow may push to it).
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/openwgt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=OpenWGT
            org.opencontainers.image.description=OpenWGT in the browser: an open engine for Widget Workshop, served by nginx. No game data: bring the CD image or play without it.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=OpenWGT
            org.opencontainers.image.description=OpenWGT in the browser: an open engine for Widget Workshop, served by nginx. No game data: bring the CD image or play without it.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      # Only the packages: not the container build's record, which
      # docker/build-push-action keeps as an artifact of its own.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: openwgt-*
          merge-multiple: true

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A new release is made with its files, so that it's published
        # (and its "published" event sent) only once they're all up; a run
        # again on the same tag replaces them.
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi
