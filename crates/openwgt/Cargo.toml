[package]
name = "openwgt"
version = "0.13.0"
description = "OpenWGT: an open engine for Maxis' Widget Workshop"
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

# `js`: scripts in JavaScript (crates/script-js, QuickJS) besides the
# built-in command language. QuickJS is C: the browser build needs a
# clang for wasm32 (docs/scripting-js-engine.md).
[features]
default = ["js"]
js = ["dep:script-js"]

[dependencies]
script-js = { path = "../script-js", optional = true }
engine = { path = "../engine" }
formats = { path = "../formats" }
platform = { path = "../platform" }
web-time = "1.1"
# `wasmbind`: the browser's clock on wasm, where `std::time` panics.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# The system's (or the browser's) language, for the port's own packs
# without a CD.
sys-locale = { version = "0.3", features = ["js"] }
# The network parts' web sockets (`net`): natively a thread each on
# tungstenite, with rustls for wss:// (`tls`: webpki-roots, the Mozilla
# roots built in); in the browser the page's WebSocket.
ewebsock = { version = "0.8", features = ["tls"] }

# The file dialog that asks for the CD when it isn't given (`pick`):
# natively only, the browser's page asks for it itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"
# The crypto of ewebsock's rustls: ring, not the default aws-lc-rs, which
# needs CMake and NASM to build on Windows. With ring alone among its
# features, rustls takes it without being told.
rustls ={ version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Whether rfd has a dialog to show (`pick::has_dialog`): the portal's
# FileChooser on the session bus.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt"] }

# The browser build (docs/web.md): the page's storage and its query.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The version of the wasm-bindgen CLI that builds the page
# (tools/build-web.sh): the two must match exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "EventTarget", "Location", "Window"] }

# The Windows executable's icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# The Linux packages (cargo-deb, cargo-generate-rpm; the CI's linux job):
# the program, its desktop entry and icon, the licence and the README.
[package.metadata.deb]
maintainer = "gustavn64 <180873811+gustavn64@users.noreply.github.com>"
copyright = "Doridian and the OpenWGT authors"
license-file = ["../../LICENSE", "0"]
section = "games"
priority = "optional"
extended-description = """\
An open engine for Widget Workshop: A Mad Scientist's Laboratory (Maxis, \
1995), with its own graphics, sounds and data, so it runs without the \
original CD; with the CD it can use the original's instead."""
depends = "$auto"
assets = [
    ["target/release/openwgt", "usr/bin/", "755"],
    ["res/openwgt.desktop", "usr/share/applications/", "644"],
    ["res/icon.png", "usr/share/icons/hicolor/512x512/apps/openwgt.png", "644"],
    ["../../README.md", "usr/share/doc/openwgt/README.md", "644"],
    # The bundled fonts' licences (LGPL-2.1+, OFL-1.1): they're in the
    # program.
    ["../engine/fonts/README.md", "usr/share/doc/openwgt/fonts/README.md", "644"],
    ["../engine/fonts/LICENSE-LGPL-2.1.txt", "usr/share/doc/openwgt/fonts/LICENSE-LGPL-2.1.txt", "644"],
    ["../engine/fonts/LICENSE-OFL-1.1.txt", "usr/share/doc/openwgt/fonts/LICENSE-OFL-1.1.txt", "644"],
]

[package.metadata.generate-rpm]
summary = "An open engine for Maxis' Widget Workshop"
url = "https://gustavn.se/openwgt"
assets = [
    { source = "target/release/openwgt", dest = "/usr/bin/openwgt", mode = "755" },
    { source = "res/openwgt.desktop", dest = "/usr/share/applications/openwgt.desktop", mode = "644" },
    { source = "res/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/openwgt.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/openwgt/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/openwgt/LICENSE", mode = "644", doc = true },
    { source = "../engine/fonts/README.md", dest = "/usr/share/licenses/openwgt/fonts/README.md", mode = "644", doc = true },
    { source = "../engine/fonts/LICENSE-LGPL-2.1.txt", dest = "/usr/share/licenses/openwgt/fonts/LICENSE-LGPL-2.1.txt", mode = "644", doc = true },
    { source = "../engine/fonts/LICENSE-OFL-1.1.txt", dest = "/usr/share/licenses/openwgt/fonts/LICENSE-OFL-1.1.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
