[package]
name = "script-js-spike"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Phase 0 spike (throwaway): QuickJS-NG via rquickjs vs Boa.
[features]
quickjs = ["dep:rquickjs"]
boa = ["dep:boa_engine", "dep:boa_gc", "dep:getrandom"]
# a wasm-bindgen export for running the spike in node (speed in wasm)
node = ["dep:wasm-bindgen"]

[dependencies]
rquickjs = { version = "0.14", optional = true, default-features = false, features = ["std", "rust-alloc"] }
boa_engine = { version = "0.22", optional = true, default-features = false }
boa_gc = { version = "0.22", optional = true }
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
# Boa (rand 0.10) needs a getrandom backend on wasm32-unknown-unknown
getrandom = { version = "0.4", optional = true, features = ["wasm_js"] }

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust]
unsafe_code = "deny"
