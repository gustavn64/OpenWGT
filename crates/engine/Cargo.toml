[package]
name = "engine"
version = "0.11.0"
description = "Widget Workshop's game: the gadgets, the simulation and the editor"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
formats = { path = "../formats" }
# The widget links' deflate (`link`).
miniz_oxide = "0.9"
# The network parts' random channel names (`net`): the system's randomness.
getrandom = "0.4"

# In the browser, `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# The test bench (`gadgets::bench`) for other crates' tests.
testing = []

[lints]
workspace = true
