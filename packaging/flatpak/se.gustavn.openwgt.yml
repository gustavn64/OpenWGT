# Flathub's manifest (packaging/README.md). The crates come from
# cargo-sources.json, which flatpak-cargo-generator.py makes from
# Cargo.lock for each release (Flathub builds offline).
id: se.gustavn.openwgt
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: openwgt
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the sound (cpal's ALSA, through the runtime's PulseAudio plugin)
  - --socket=pulseaudio
  # the CD image comes through the file chooser portal; nothing else
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/openwgt/cargo
modules:
  - name: openwgt
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked -p openwgt
      - install -Dm755 target/release/openwgt /app/bin/openwgt
      - install -Dm644 crates/widget/res/openwgt.desktop /app/share/applications/se.gustavn.openwgt.desktop
      - desktop-file-edit --set-icon=se.gustavn.openwgt /app/share/applications/se.gustavn.openwgt.desktop
      - install -Dm644 crates/widget/res/icon.png /app/share/icons/hicolor/512x512/apps/se.gustavn.openwgt.png
      - install -Dm644 packaging/flatpak/se.gustavn.openwgt.metainfo.xml /app/share/metainfo/se.gustavn.openwgt.metainfo.xml
    sources:
      - type: git
        url: https://github.com/gustavn64/OpenWGT.git
        tag: v0.11.0
      - cargo-sources.json
